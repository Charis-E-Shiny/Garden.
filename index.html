<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garden.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: url('...') no-repeat center center fixed; 
      background-size: cover;
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
    }
    
    /* Header & Logo Area */
    header { background: #ffffff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid #e5e7eb; }
    .logo-container img { height: 40px; width: auto; object-fit: contain; }
    .logo-placeholder { width: 40px; height: 40px; background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #64748b; }
    h1 { font-size: 1.25rem; color: #1e293b; }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 75%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #ffffff; color: #1e293b; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }

    /* Controls & Input */
    .input-area { background: #ffffff; padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }
    input[type="text"] { flex: 1; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; }
    button { padding: 0.75rem 1.25rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-send { background: #2563eb; color: white; }
    .btn-send:hover { background: #1d4ed8; }
    .btn-mic { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-mic.recording { background: #ef4444; color: white; border-color: #dc2626; }
    
    #status { padding: 0.5rem 2rem; font-size: 0.85rem; color: #6b7280; background: #f9fafb; text-align: center; }
  </style>
  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

  <header>
    <div class="logo-container">
      <!-- Replace 'logo.png' with your image file name -->
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-placeholder" style="display:none;">LOGO</div>
    </div>
    <h1>Garden.</h1>
  </header>

  <div id="status">Hello! Welcome to Garden.</div>

  <div id="chat-box"></div>

  <div class="input-area">
    <button id="mic-btn" class="btn-mic" title="Voice Input">🎙️</button>
    <input type="text" id="user-input" placeholder="Type a message or use voice..." disabled />
    <button id="send-btn" class="btn-send" disabled>➡️</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
